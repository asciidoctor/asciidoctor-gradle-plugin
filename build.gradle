plugins {
    id 'org.asciidoctor.internal.root'
    id 'com.github.ben-manes.versions' version '0.50.0' apply false
    id 'com.github.kt3k.coveralls' version '2.12.2' apply false
    id 'net.ossindex.audit' version '0.4.11' apply false
    id 'org.kordamp.jdeps' version '0.2.0' apply false
    id 'org.ysb33r.cloudci' version '4.0.0' apply false
    id 'idea'

    id 'org.ysb33r.ivypot'
    id 'org.ysb33r.os' apply false
    id 'org.ysb33r.jruby.resolver' apply false
}

import org.gradle.util.GradleVersion
import java.text.SimpleDateFormat

repositories {
    mavenCentral()
}

ivypot {
    projectsWithDependencies { it.startsWith(':asciidoctor-gradle-') || it ==~ /^:asciidoctor5-.+-plugin$/ }

    binaryRepositories {
        source 'nodejs', {
            rootUri = 'https://nodejs.org/dist/'
            artifactPattern = 'v[revision]/[module]-v[revision]-[classifier].[ext]'
        }
    }
}

// ********* TEMPORARY FOR LOCAL DEV
tasks.named('syncRemoteRepositories') { enabled = false }
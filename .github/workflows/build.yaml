name: Build
on:
  push:
    paths-ignore:
      - '*.adoc'
      - docs/**
  pull_request:
    paths-ignore:
      - '*.adoc'
      - docs/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
      - name: Licensing
        run: ./gradlew --console=plain -S license
      - name: Coding style
        run: ./gradlew --console=plain -S codenarcAll
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
      - name: Cache offline repository
        uses: actions/cache@v3
        with:
          path: .offline-repo
          key: ${{ runner.os }}-offline-repo-${{ hashFiles('module-versions.properties') }}
          restore-keys: ${{ runner.os }}-offline-repo-
      - name: Build offline repository
        run: ./gradlew --console=plain --no-build-cache syncRemoteRepositories
      - name: Build
        run: ./gradlew --console=plain --warning-mode=all -s clean assemble
      - name: Test
        run: ./gradlew --console=plain --warning-mode=all -s check --no-parallel -x gradleTest -x :asciidoctor-gradle-jvm-gems:integrationTest
        env:
          JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
      # Stop gradlew to avoid locking issues
      - name: Cleanup
        run: ./gradlew --stop
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [ 21 ]
        # os: [ubuntu-latest, macos-latest]
        # java: [ 8, 11 ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: zulu
    - uses: gradle/gradle-build-action@v2
      with:
        gradle-home-cache-cleanup: true
    - name: Cache offline repository
      uses: actions/cache@v3
      with:
        path: .offline-repo
        key: ${{ runner.os }}-offline-repo-${{ hashFiles('module-versions.properties') }}
        restore-keys: ${{ runner.os }}-offline-repo-
    - name: Build offline repository
      run: ./gradlew --console=plain --no-build-cache syncRemoteRepositories
    - name: Build
      run: ./gradlew  -i -S --console=plain --no-build-cache assemble
    - name: Integration tests
      run: ./gradlew  -i -s --console=plain --no-build-cache test integrationTest
    - name: Remote tests for classic plugins
      run: ./gradlew  -i -s --console=plain --no-build-cache remoteTest
    - name: Gradle tests
      run: ./gradlew -i -s --console=plain --no-build-cache gradleTest 

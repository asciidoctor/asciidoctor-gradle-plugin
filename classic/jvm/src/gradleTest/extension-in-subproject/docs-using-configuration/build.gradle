plugins {
    id 'org.asciidoctor.jvm.convert.classic'
}

configurations {
    asciidocExt {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    asciidocExt project(':extension')
}

asciidoctorj {
    logLevel 'DEBUG'
}

asciidoctor {
    configurations 'asciidocExt'
    executionMode = 'CLASSPATH'
}

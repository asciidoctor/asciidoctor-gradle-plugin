// tag::use-gems[]
plugins {
    id 'org.asciidoctor.jvm.convert.classic'
    id 'org.asciidoctor.jvm.gems.classic'
}
// end::use-gems[]

apply from: "${System.getProperty('OFFLINE_REPO')}/repository.gradle"

// tag::use-gems[]
repositories {
    ruby.gems() // <1>
}

dependencies {
    asciidoctorGems 'rubygems:asciidoctor-bibtex:0.8.0', {
        exclude module: 'asciidoctor'
    }
}

asciidoctor {
    withGemJar 'asciidoctorGemsJar'

    secondarySources {
        include 'biblio.bib'
    }

    attributes 'bibtex-file': file("${sourceDir}/biblio.bib")
}
// end::use-gems[]

dependencies {
    constraints {
        // latex-decode 0.5.0 and later require Ruby 3.3, and the JRuby 9.4 that the tests use implements Ruby 3.1
        asciidoctorGems('rubygems:latex-decode') {
            version {
                strictly('0.4.2')
            }
        }
    }
}

task runGradleTest {
    dependsOn 'asciidoctor'
}


plugins {
    id 'org.asciidoctor.jvm.epub.classic'
}

apply from: "${System.getProperty('OFFLINE_REPO')}/repository.gradle"

asciidoctorEpub {
    ebookFormats = [EPUB3]

    sources {
        include 'epub3.adoc'
    }

    executionMode = IN_PROCESS
}

task runGradleTest {
    dependsOn asciidoctorEpub
}

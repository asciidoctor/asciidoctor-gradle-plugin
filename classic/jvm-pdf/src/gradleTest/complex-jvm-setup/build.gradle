// tag::using-two-plugins-three-backends[]
plugins {
    id 'org.asciidoctor.jvm.pdf.classic'
}

apply from: "${System.getProperty('OFFLINE_REPO')}/repository.gradle"

asciidoctorj {
    modules {
        diagram.use()
    }
    logLevel 'INFO'
}

asciidoctorPdf {
    executionMode = OUT_OF_PROCESS
    logDocuments true
    sourceDir 'src/docs/asciidoc'

    sources {
        include 'subdir/sample2.ad'
    }
}
// end::using-two-plugins-three-backends[]

task runGradleTest {
    dependsOn asciidoctorPdf
}

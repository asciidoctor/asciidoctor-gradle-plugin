project:
  name: asciidoctor-gradle-plugin
  description: Asciidoctor Gradle Plugin
  longDescription: Runs Asciidoctor on a Gradle project
  links:
    homepage: https://github.com/asciidoctor/asciidoctor-gradle-plugin
  authors:
    - Andres Almiray
  license: Apache-2.0
  inceptionYear: 2013

release:
  github:
    branch: master
    overwrite: true
    releaseName: 'Release {{projectVersion}}'
    changelog:
      formatted: ALWAYS
      preset: conventional-commits
      skipMergeCommits: true
      contributors:
        format: '- {{contributorName}}{{#contributorUsernameAsLink}} ({{.}}){{/contributorUsernameAsLink}}'
      labelers:
        - label: 'dependencies'
          title: 'regex:^(?:deps(?:\(.*\))?!?):\s.*'
          order: 120
      categories:
        - title: '⚙️  Dependencies'
          key: 'dependencies'
          order: 80
          labels:
            - 'dependencies'
      hide:
        categories:
          - 'merge'
        contributors:
          - 'GitHub'
      replacers:
        - search: 'deps: '

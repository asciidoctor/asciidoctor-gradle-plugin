plugins {
    id 'org.asciidoctor.internal.model5.gradle.project'
}

agProject {
    configurePlugin(
        'org.asciidoctor.core.base',
        'Asciidoctor Core Base Plugin',
        'Forms the core of all Asciidoctor plugins',
        'org.asciidoctor.gradle.model5.core.plugins.AsciidoctorCoreBasePlugin',
        [],
        true
    )
    configurePlugin(
        'org.asciidoctor.core',
        'Asciidoctor Core Plugin',
        'Registers a default publication along with the asciidocAll task',
        'org.asciidoctor.gradle.model5.core.plugins.AsciidoctorCorePlugin',
        [],
        true
    )
    configurePlugin(
        'org.asciidoctor.themes',
        'Asciidoctor Themes management plugin',
        'Manages themes for for various ASciidoctor backends',
        'org.asciidoctor.gradle.model5.core.plugins.AsciidoctorCoreThemesPlugin',
        [],
        true
    )
}

dependencies {
    compileOnly(project(':asciidoctoreditorconfig'))
}

apply from: "${rootDir}/gradle/plugin-is-cc-compatible.gradle"

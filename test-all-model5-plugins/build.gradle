plugins {
    id 'org.asciidoctor.internal.model5.gradle.test-all'
}

configurations {
    pluginProjects
    gradleTestCustomManifest.extendsFrom(pluginProjects)
    configCacheGradleTestCustomManifest.extendsFrom(pluginProjects)
    jdk17GradleTestCustomManifest.extendsFrom(pluginProjects)
    jdk21GradleTestCustomManifest.extendsFrom(pluginProjects)
}

dependencies {
    pluginProjects(project(':asciidoctor5-core-plugin'))
    pluginProjects(project(path: ':asciidoctor5-jvm-core-plugin', configuration: 'default'))
    pluginProjects(project(':asciidoctor5-js-core-plugin'))
}




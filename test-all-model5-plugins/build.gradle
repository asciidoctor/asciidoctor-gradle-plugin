plugins {
    id 'org.asciidoctor.internal.model5.gradle.test-all'
}

dependencies {
    runtimeOnly(project(':asciidoctor5-core-plugin'))
    runtimeOnly(project(path: ':asciidoctor5-jvm-core-plugin', configuration: 'default'))
    runtimeOnly(project(':asciidoctor5-js-core-plugin'))
    runtimeOnly(project(':asciidoctor5-downdoc-plugin'))
    runtimeOnly(project(':asciidoctor5-jrubytools-plugin'))
    runtimeOnly(project(':asciidoctor5-kramdown-plugin'))
    runtimeOnly(project(':adocfmt'))
}

gradleTestSets {
    testSets {
        main {
            gradleArguments '-s'
        }
    }
}

tasks.withType(Test).configureEach {
    forkEvery = 2
    maxHeapSize = '1g'
}